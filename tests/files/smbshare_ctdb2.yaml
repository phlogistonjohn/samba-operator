---
apiVersion: samba-operator.samba.org/v1alpha1
kind: SmbShare
metadata:
  name: cshare2
  annotations:
    samba-operator.samba.org/node-spread: "true"
    samba-operator.samba.org/ctdb-addrs: "net1: 172.16.8.60/24 172.16.8.61/24 172.16.8.62/24"
spec:
  shareName: "Three Kingdoms"
  readOnly: false
  browseable: true
  securityConfig: adsec1
  scaling:
    availabilityMode: clustered
    minClusterSize: 2
  storage:
    pvc:
      spec:
        accessModes:
          - ReadWriteMany
        resources:
          requests:
            storage: 1Gi
